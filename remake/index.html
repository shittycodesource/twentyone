<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Remake</title>
    <link rel="stylesheet" href="style.css">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Gloock&display=swap" rel="stylesheet">
</head>
<body>
    
    <div class="game" id="app">

        <aside class="sidebar">
            <header class="sidebar__header">YOUR CARDS</header>
            <div class="sidebar__inner">

                <div class="cards-grid" id="playerCards">
                    <!-- <div class="play-card play-card--anonymous">3</div>
                    <div class="play-card">11</div>
                    <div class="play-card">9</div>
                    <div class="play-card">9</div>
                    <div class="play-card">9</div>
                    <div class="play-card">9</div>
                    <div class="play-card">9</div> -->
                </div>

            </div>
            <footer class="sidebar__footer">

                <div class="cards-counter hide" id="playerCardsCounter">
                    <!-- 3 / 21                     -->
                </div>
                
            </footer>
        </aside>


        <main class="main">
            <header class="main__header">TWENTY ONE</header>
            <center><div class="round-counter">ROUND: 1</div></center>

            <div class="scene">
                <!-- scene -->
                <div class="scene__opponent"></div>
                <div class="scene__table"></div>

                <div class="scene__ui">

                    <img class="scene__cards-decoration" src="./assets/cards.png" alt="cards">
                    
                    <div class="scene__cards">

                        <div class="scene__exposed">
                            <!-- Exposed cards and the mystery card is here -->
                            
                            <!-- <div class="exposed-card">1</div>
                            <div class="exposed-card">2</div>
                            <div class="exposed-card  exposed-card--anonymous">?</div> -->

                        </div>
                        <div class="scene__helper hide">
                            <!-- 1 + 2 + ? / 21 -->
                        </div>

                    </div> <!-- /.scene cards -->

                </div> <!-- /.scene ui -->

            </div>

            <div class="action-box">
                <main class="action-box__main">
                    <!-- Kirillo is thinking... -->
                </main>
                <footer class="action-box__footer hide" id="buttons">

                    <button type="button" class="btn " id="take">TAKE CARD</button>
                    <button type="button" class="btn " id="pass">PASS</button>

                </footer>
            </div>
        </main>


        <aside class="sidebar">
            <header class="sidebar__header">SPECIALS</header>
            <div class="sidebar__inner">

                <div class="cards-grid">
                    <!-- <div class="play-card">3</div>
                    <div class="play-card">11</div>
                    <div class="play-card">9</div>
                    <div class="play-card">9</div> -->
                </div>

            </div>
            <footer class="sidebar__footer"></footer>
        </aside>

    </div>

    
    <!-- <script src="script.js"></script> -->
    <script src="remake.js"></script>
</body>
</html>
